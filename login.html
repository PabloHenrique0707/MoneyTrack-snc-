<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTrack Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login">

    <div class="login-container">

        <div id="loginBox">
            <div class="icone-dinheiro-logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 6v12"></path>
                    <path d="M15 9.5C15 8.12 13.66 7 12 7s-3 1.12-3 2.5 1.34 2.5 3 2.5 3 1.12 3 2.5-1.34 2.5-3 2.5-3-1.12-3-2.5"></path>
                </svg>
            </div>
            <h1>MoneyTrack</h1>

            <input type="email" id="email" placeholder="Email">
            <div class="input-senha-container">
                <input type="password" id="senha" placeholder="Senha">
                <span id="botaoOlho" onclick="alternarVisibilidadeSenha()">
                    <svg id="iconeOlho" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </span>
            </div>

            <button onclick="fazerLogin()">Entrar</button>

            <p onclick="mostrarCadastro()" class="trocar">
                Criar conta
            </p>
        </div>

        <div id="cadastroBox">
            <div class="icone-dinheiro-logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 6v12"></path>
                    <path d="M15 9.5C15 8.12 13.66 7 12 7s-3 1.12-3 2.5 1.34 2.5 3 2.5 3 1.12 3 2.5-1.34 2.5-3 2.5-3-1.12-3-2.5"></path>
                </svg>
            </div>
            <h1>Criar Conta</h1>

            <input type="text" id="nomeCadastro" placeholder="Nome">
            <input type="email" id="emailCadastro" placeholder="Email">
            <input type="password" id="senhaCadastro" placeholder="Senha">

            <button onclick="cadastrarNovoUsuario()">
                Cadastrar
            </button>

            <p onclick="mostrarLogin()" class="trocar">
                Já tenho conta
            </p>
        </div>

    </div>

    <div id="popup"></div>

    <script src="../js/script.js"></script>

</body>
</html>
